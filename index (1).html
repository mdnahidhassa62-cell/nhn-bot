<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHN AI CHAT BOT</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#6b7690;--brand:#1f4fd8;--me:#1f4fd8;--meink:#fff;--bot:#e8edf6;--line:#dbe2ee}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#151c2f;--ink:#e8edf8;--mute:#8d98b5;--brand:#6c8cff;--me:#3a5fe0;--bot:#212a42;--line:#27304a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--card)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--brand);flex:none}
.mav{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;align-self:flex-end}
.row{display:flex;gap:8px;align-items:flex-end;max-width:92%;align-self:flex-start}
.row .m{max-width:none}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;color:var(--brand)}
header p{margin:2px 0 0;font-size:14px;color:var(--mute)}
#log{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--me);color:var(--meink);align-self:flex-end;border-bottom-right-radius:4px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{font:inherit;font-weight:600;padding:0 20px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
</style>
</head>

  <div id="log"><div class="m bot">আসসালামু আলাইকুম! আমি NHN AI CHAT BOT। আপনাকে কীভাবে সাহায্য করতে পারি?</div></div>
  <form id="f"><input id="q" placeholder="আপনার মেসেজ লিখুন..." autocomplete="off" required><button id="b">পাঠান</button></form>
</div>
<script>
const log=document.getElementById("log"),f=document.getElementById("f"),q=document.getElementById("q"),b=document.getElementById("b");
const history=[];
function add(text,cls){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const text=q.value.trim(); if(!text) return;
  q.value=""; add(text,"me"); history.push({role:"user",content:text});
  b.disabled=true; const wait=add("লিখছে...","bot");
  try{
    const r=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"সমস্যা হয়েছে");
    wait.textContent=d.reply; history.push({role:"assistant",content:d.reply});
  }catch(err){wait.textContent="উত্তর আনা যায়নি: "+err.message; history.pop()}
  b.disabled=false; q.focus(); log.scrollTop=log.scrollHeight;
});
</script>
